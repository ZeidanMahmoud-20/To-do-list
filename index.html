<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskPulse — To Do List App</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app">

    <header id="hd">
      <section id="logo__cont">
        <span id="logo__mark">✓</span>
        <span id="logo__text">TaskPulse</span>
      </section>
    </header>

    <main id="mn">

      <section id="input__sect">
        <h2 id="input__title">Add a New Task</h2>
        <form id="input__form">
          <div id="input__row">
            <label for="input__task">Task</label>
            <input type="text" id="input__task" placeholder="What do you need to do?" autocomplete="off">
          </div>
          <div id="input__row">
            <label for="input__date">Due date</label>
            <input type="date" id="input__date">
          </div>
          <button type="submit" id="input__btn">Add task</button>
        </form>
      </section>

      <section id="task__sect">
        <div id="task__head">
          <h2 id="task__title">Your Tasks</h2>
          <span id="task__count">0 tasks</span>
        </div>

        <ul id="task__list"></ul>

        <p id="empty__state">Nothing here yet. Add your first task above.</p>

        <button type="button" id="clear__btn">Clear completed</button>
      </section>

    </main>

    <footer id="ft">
      <p>&copy; 2026 TaskPulse. All rights reserved.</p>
    </footer>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
